[project]
name = "shared-accounts"
version = "0.1.0"
description = "Claude Authorization Bot - automates Claude Code authorization via Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.1",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "databases>=0.9.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "punq>=0.7.0",
    "python-dotenv>=1.0.1",
    "playwright>=1.40.0",
    "structlog>=23.0.0",
    "click>=8.1.7",
]

[project.scripts]
claude-bot = "bot.cli.__main__:cli"

[dependency-groups]
dev = [
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "prek>=0.2.3",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

# Ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    "alembic/",
    "migrations/",
    ".git",
    "__pycache__",
    ".venv",
    "venv",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults (important for aiogram DI)
    "C901",  # complexity (bot handlers can be complex)
]

[tool.ruff.lint.isort]
known-first-party = ["bot"]  # TODO: Update to your package name
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py are ok

# Mypy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false  # Relaxed for bot handlers
disallow_incomplete_defs = false  # Partial typing is ok
disallow_untyped_decorators = false  # Important for aiogram decorators

[[tool.mypy.overrides]]
module = [
    "aiogram.*",
    "punq.*",
    "databases.*",
    "playwright.*",
    "structlog.*",
    "asyncpg.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]

[tool.coverage.run]
source = ["bot"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
