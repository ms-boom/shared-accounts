version: '3'

vars:
  PYTHON_SOURCE: src
  TEST_SOURCE: tests

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install development dependencies
    cmds:
      - uv sync --group dev

  format:
    desc: Format code with ruff
    cmds:
      - ruff check --fix {{.PYTHON_SOURCE}} {{.TEST_SOURCE}}
      - ruff format {{.PYTHON_SOURCE}} {{.TEST_SOURCE}}

  lint:
    desc: Run all linting tools
    cmds:
      - task: lint:ruff
      - task: lint:mypy
      - task: lint:imports

  lint:ruff:
    desc: Run ruff linter and formatter checks
    cmds:
      - ruff check {{.PYTHON_SOURCE}} {{.TEST_SOURCE}}
      - ruff format --check {{.PYTHON_SOURCE}} {{.TEST_SOURCE}}

  lint:mypy:
    desc: Run type checking with mypy
    cmds:
      - mypy src/core src/bot

  lint:imports:
    desc: Check import boundaries between layers
    cmds:
      - lint-imports

  test:
    desc: Run tests with pytest
    cmds:
      - pytest {{.CLI_ARGS}}

  test:unit:
    desc: Run unit tests only
    cmds:
      - pytest -m unit

  test:integration:
    desc: Run integration tests only
    cmds:
      - pytest -m integration

  coverage:
    desc: Run tests with coverage report
    cmds:
      - pytest --cov=src/core --cov=src/bot --cov-report=html --cov-report=term-missing

  prek:install:
    desc: Install pre-commit hooks
    cmds:
      - prek install

  prek:
    desc: Run pre-commit hooks manually
    cmds:
      - prek run --all-files

  prek:update:
    desc: Update pre-commit hooks to latest versions
    cmds:
      - prek autoupdate

  qa:
    desc: Full quality assurance (format + lint + lint:imports + coverage)
    cmds:
      - task: format
      - task: lint
      - task: coverage

  check:
    desc: Run all quality checks (lint + test)
    cmds:
      - task: lint
      - task: test

  dev:
    desc: Development workflow (install + format + check)
    cmds:
      - task: install
      - task: format
      - task: check

  # Database migrations
  db:upgrade:
    desc: Apply database migrations
    cmds:
      - alembic upgrade head

  db:downgrade:
    desc: Rollback one migration
    cmds:
      - alembic downgrade -1

  db:revision:
    desc: Create a new migration (use -- -m "message")
    cmds:
      - alembic revision --autogenerate {{.CLI_ARGS}}

  db:current:
    desc: Show current migration version
    cmds:
      - alembic current

  # Running services
  run:
    desc: Run the Telegram bot
    cmds:
      - python -m bot

  run:worker:
    desc: Run the task worker standalone
    cmds:
      - python -m core.worker

  run:cli:
    desc: Run CLI
    cmds:
      - python -m core.cli

  clean:
    desc: Clean up temporary files and cache
    cmds:
      - find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
      - find . -type f -name "*.pyc" -delete
      - rm -rf .pytest_cache
      - rm -rf htmlcov
      - rm -rf .coverage
      - rm -rf .mypy_cache
      - rm -rf .ruff_cache
