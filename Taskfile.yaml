version: '3'

vars:
  PYTHON_SOURCE: src
  TEST_SOURCE: tests

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install development dependencies
    cmds:
      - uv sync --group dev

  format:
    desc: Format code with ruff
    cmds:
      - uv run ruff check --fix {{.PYTHON_SOURCE}} {{.TEST_SOURCE}}
      - uv run ruff format {{.PYTHON_SOURCE}} {{.TEST_SOURCE}}

  lint:
    desc: Run all linting tools
    cmds:
      - task: lint:ruff
      - task: lint:mypy
      - task: lint:imports

  lint:ruff:
    desc: Run ruff linter and formatter checks
    cmds:
      - uv run ruff check {{.PYTHON_SOURCE}} {{.TEST_SOURCE}}
      - uv run ruff format --check {{.PYTHON_SOURCE}} {{.TEST_SOURCE}}

  lint:mypy:
    desc: Run type checking with mypy
    cmds:
      - uv run mypy src/core src/bot

  lint:imports:
    desc: Check import boundaries between layers
    cmds:
      - uv run lint-imports

  test:
    desc: Run tests with pytest
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  test:unit:
    desc: Run unit tests only
    cmds:
      - uv run pytest -m unit

  test:integration:
    desc: Run integration tests only
    cmds:
      - uv run pytest -m integration

  coverage:
    desc: Run tests with coverage report
    cmds:
      - uv run pytest --cov=src/core --cov=src/bot --cov-report=html --cov-report=term-missing

  prek:install:
    desc: Install pre-commit hooks
    cmds:
      - uv run prek install

  prek:
    desc: Run pre-commit hooks manually
    cmds:
      - uv run prek run --all-files

  prek:update:
    desc: Update pre-commit hooks to latest versions
    cmds:
      - uv run prek autoupdate

  qa:
    desc: Full quality assurance (format + lint + lint:imports + coverage)
    cmds:
      - task: format
      - task: lint
      - task: coverage

  check:
    desc: Run all quality checks (lint + test)
    cmds:
      - task: lint
      - task: test

  dev:
    desc: Development workflow (install + format + check)
    cmds:
      - task: install
      - task: format
      - task: check

  # Database migrations
  db:upgrade:
    desc: Apply database migrations
    cmds:
      - uv run alembic upgrade head

  db:downgrade:
    desc: Rollback one migration
    cmds:
      - uv run alembic downgrade -1

  db:revision:
    desc: Create a new migration (use -- -m "message")
    cmds:
      - uv run alembic revision --autogenerate {{.CLI_ARGS}}

  db:current:
    desc: Show current migration version
    cmds:
      - uv run alembic current

  # Running services
  run:
    desc: Run the Telegram bot
    cmds:
      - uv run python -m bot

  run:worker:
    desc: Run the task worker standalone
    cmds:
      - uv run python -m core.worker

  run:cli:
    desc: Run CLI
    cmds:
      - uv run python -m core.cli

  # Docker: start/stop
  up:
    desc: Start the bot in Docker (no VPN)
    cmds:
      - docker compose up -d

  up:vpn:
    desc: Start the bot in Docker through the WireGuard VPN
    cmds:
      - docker compose -f docker-compose.vpn.yml up -d

  down:
    desc: Stop the Docker bot (no VPN)
    cmds:
      - docker compose down

  down:vpn:
    desc: Stop the Docker bot (VPN mode)
    cmds:
      - docker compose -f docker-compose.vpn.yml down

  # Docker: VPN diagnostics
  vpn:status:
    desc: Show WireGuard tunnel state (handshake, transfer)
    cmds:
      - docker compose -f docker-compose.vpn.yml exec wireguard wg show

  vpn:ip:
    desc: Show the bot's actual outbound IP (should be the VPN server's)
    cmds:
      - docker compose -f docker-compose.vpn.yml exec bot wget -qO- https://api.ipify.org
      - echo

  clean:
    desc: Clean up temporary files and cache
    cmds:
      - find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
      - find . -type f -name "*.pyc" -delete
      - rm -rf .pytest_cache
      - rm -rf htmlcov
      - rm -rf .coverage
      - rm -rf .mypy_cache
      - rm -rf .ruff_cache
