[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

# Test markers
markers =
    unit: Unit tests (fast, mocked dependencies)
    integration: Integration tests (with database)
    slow: Slow tests (can be skipped with -m "not slow")
    requires_db: Requires database connection
    requires_playwright: Requires Playwright browser

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --durations=10
    --asyncio-mode=auto

# Coverage settings (optional)
# addopts = --cov=bot --cov-report=html --cov-report=term-missing

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests.log
log_file_level = DEBUG

# Ignore patterns
norecursedirs = .git .tox dist build *.egg __pycache__ .venv venv node_modules

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
