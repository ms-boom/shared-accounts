<!DOCTYPE html>
<html lang="en-US" data-theme="claude" data-mode="light">
<head>
  <meta charset="UTF-8">
  <title>Claude</title>
</head>
<body class="bg-bg-100 text-text-100 font-ui min-h-screen">
  <div id="root">
    <div class="root">
      <nav>
        <a href="#">
          <svg viewBox="0 0 112 24" height="24"><!-- Claude logo --></svg>
        </a>
      </nav>
      <main>
        <h2>Check your email</h2>
        <div class="login-form">
          <form>
            <div class="text-center">
              <p class="text-text-400">To continue, click the link sent to</p>
              <p class="text-text-300 font-medium">user@example.com</p>
            </div>
            <div class="text-text-400 text-sm">
              <p>Signing in from another browser?
                <button data-testid="enter-code">Enter verification code</button>
              </p>
              <p>Not seeing the email in your inbox?
                <button>Try sending again</button>
              </p>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
