version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: claude_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network

  # Telegram Bot Service
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m bot
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/claude_bot
      DATA_DIR: /data
      SESSION_DIR: /data/sessions
      LOG_DIR: /data/logs
      ERROR_DIR: /data/errors
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_TIMEOUT: "30000"
      LOG_LEVEL: INFO
    volumes:
      - bot_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bot_network

  # Worker Service
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: python -m bot.worker
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/claude_bot
      DATA_DIR: /data
      SESSION_DIR: /data/sessions
      LOG_DIR: /data/logs
      ERROR_DIR: /data/errors
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_TIMEOUT: "30000"
      WORKER_POLL_INTERVAL: "1.0"
      WORKER_RETRY_ATTEMPTS: "3"
      LOG_LEVEL: INFO
    volumes:
      - bot_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bot_network

  # Database Migrations (run once)
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/claude_bot
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

volumes:
  postgres_data:
  bot_data:
