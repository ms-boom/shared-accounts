version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/claude_bot.db
    volumes:
      - bot_data:/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/claude_bot.db
    volumes:
      - bot_data:/data

networks:
  bot_network:
    driver: bridge

volumes:
  bot_data:
