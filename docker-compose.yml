name: shared-accounts

services:
  # ⚠️ DUPLICATE of the bot service. Keep it identical to docker-compose.vpn.yml
  #    (that file adds only network_mode and depends_on).
  #    If you change bot here, mirror the change in docker-compose.vpn.yml.
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/claude_bot.db
    volumes:
      - bot_data:/data

volumes:
  bot_data:
